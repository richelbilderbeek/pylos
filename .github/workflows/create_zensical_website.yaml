# Adapted from https://zensical.org/docs/publish-your-site/#with-github-actions
#
# Builds the website, including a version of the game
# that can be played online, using Qt for WebAssembly and Emscripten
name: Create Zensical website

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create_zensical_website.yaml
      - .github/smoke_test.py
      - 'docs/**'
      - zensical.toml
      # The game
      - '*.cpp'
      - '*.h'
      - '*.png'
      - '*.pri'
      - '*.pro'
      - '*.qrc'
      - '*.ui'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  QT_VERSION: 6.11.3
  # Must match the Qt version, see https://doc.qt.io/qt-6/wasm.html
  EMSCRIPTEN_VERSION: 4.0.7
  # The game uses code from these repositories,
  # pinned to commits that are known to work
  DOTMATRIX_COMMIT: 9524f9a4e57c31e464f9fca2443ba460aaccd904
  RIBICLASSES_COMMIT: bbf10cb8e05db9d4dd020e66b9b562d95c75033e

jobs:
  create_zensical_website:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      # The project files expect these repositories next to this one
      - name: Get the other repositories
        run: |
          cd ..
          for repo in DotMatrix RibiClasses; do
            git clone https://github.com/richelbilderbeek/$repo
          done
          git -C DotMatrix checkout "$DOTMATRIX_COMMIT"
          git -C RibiClasses checkout "$RIBICLASSES_COMMIT"
      - name: Fix DotMatrix for modern Boost
        # Modern Boost declares boost::checked_delete as noexcept,
        # so these friend declarations do not compile anymore.
        # They are not needed, as the destructor is public
        run: |
          cd ../DotMatrix
          grep --quiet "friend void boost::checked_delete" dotmatrixchar.h
          sed --in-place '/friend void boost::checked_delete<>(.*DotMatrixChar\*);/d' dotmatrixchar.h
          ! grep --quiet "friend void boost::checked_delete" dotmatrixchar.h

      - name: Install Qt
        # WebAssembly Qt also needs a desktop Qt for its host tools
        run: |
          pip install aqtinstall
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$HOME/qt"
          aqt install-qt all_os wasm "$QT_VERSION" wasm_singlethread -O "$HOME/qt"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - name: Build the game
        run: |
          mkdir build
          cd build
          "$HOME/qt/$QT_VERSION/wasm_singlethread/bin/qmake" ../PylosWebAssembly.pro
          make -j4
      - name: Add the game to the website
        run: |
          mkdir docs/game
          cp build/*.html build/*.js build/*.wasm docs/game/
          cp build/*.svg docs/game/ || true
      - name: Smoke test the game in a browser
        run: |
          pip install playwright
          (cd docs/game && python3 -m http.server 8000) &
          sleep 2
          python3 .github/smoke_test.py

      - run: pip install zensical
      - run: zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
